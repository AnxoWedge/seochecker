<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}seochecker{% endblock %}</title>
<style>
:root{
  --bg:#fbfbfa; --surface:#fff; --border:#e4e2dd; --text:#1f1e1c; --muted:#6b6862;
  --accent:#2f6f4e; --critical:#b4231f; --warning:#a56a00; --notice:#1d5f8a; --info:#5b5a57;
  --bar:#ece9e3; --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.03);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --surface:#1d1f23; --border:#2e3137; --text:#e8e6e3; --muted:#9a9793;
    --accent:#63b98a; --critical:#f0736c; --warning:#e0a442; --notice:#65aede; --info:#9a9793;
    --bar:#2a2d33; --shadow:none;
  }
}
*{box-sizing:border-box}
/* .btn sets display:inline-block, which outranks the UA stylesheet rule behind the
   hidden attribute. Without this, elements marked hidden stay visible. */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:26px 24px 64px}
a{color:var(--notice)}
h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
h2{font-size:12px;font-weight:650;margin:32px 0 12px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--muted)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em}
nav{display:flex;gap:18px;align-items:baseline;justify-content:space-between;
  padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:4px}
nav .links{display:flex;gap:16px;font-size:13.5px}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover,nav a.on{color:var(--text)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden}
.panel .pad{padding:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],select{width:100%;padding:9px 11px;font:inherit;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:13.5px;color:var(--muted)}
.checks label{display:flex;gap:7px;align-items:center;font-weight:400;font-size:13.5px;
  text-transform:none;letter-spacing:0;margin:0;cursor:pointer}
button,.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:8px;
  border:1px solid transparent;background:var(--accent);color:#fff;cursor:pointer;
  text-decoration:none;display:inline-block}
button:hover,.btn:hover{filter:brightness(1.07)}
button.ghost,.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 14px;
  border-bottom:1px solid var(--border)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:0}
.c-critical{color:var(--critical)} .c-warning{color:var(--warning)}
.c-notice{color:var(--notice)} .c-info{color:var(--info)} .c-ok{color:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;
  background:var(--bar);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pill.running{background:color-mix(in srgb,var(--notice) 16%,transparent);color:var(--notice)}
.pill.done{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.failed{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}
.pill.cancelled{background:var(--bar);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.error{background:color-mix(in srgb,var(--critical) 10%,transparent);color:var(--critical);
  border:1px solid color-mix(in srgb,var(--critical) 30%,transparent);border-radius:8px;
  padding:11px 14px;font-size:13.5px;margin-bottom:18px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);
  color:var(--muted);font-size:12px}
.empty{padding:20px;color:var(--muted);font-size:13.5px}
</style>
</head>
<body><div class="wrap">
<nav>
  <h1>seochecker</h1>
  <div class="links">
    <a href="{{ url_for('index') }}" {{ 'class=on' if request.endpoint == 'index' }}>New crawl</a>
    <a href="{{ url_for('history') }}" {{ 'class=on' if request.endpoint == 'history' }}>History</a>
  </div>
</nav>
{% block body %}{% endblock %}
<footer>seochecker {{ version }} · bound to localhost · crawls respect robots.txt unless told otherwise</footer>
</div>
{% block script %}{% endblock %}
</body>
</html>
