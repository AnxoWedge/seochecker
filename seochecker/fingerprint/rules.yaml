  # ---------------------------------------------------------- payment -------
  Stripe:
    category: payment
    signals:
      - {type: script, pattern: 'js\.stripe\.com', confidence: 1.0}
      - {type: js, key: Stripe, confidence: 1.0}

  PayPal:
    category: payment
    signals:
