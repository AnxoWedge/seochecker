  # --------------------------------------------------------- security -------
  reCAPTCHA:
    category: security
    signals:
      - {type: script, pattern: 'google\.com/recaptcha|gstatic\.com/recaptcha', confidence: 1.0}
      - {type: js, key: grecaptcha, confidence: 1.0}

  Cloudflare Turnstile:
    category: security
    signals:
      - {type: script, pattern: 'challenges\.cloudflare\.com/turnstile', confidence: 1.0}

  # ------------------------------------------------------------- libs -------
  jQuery:
    category: javascript
    signals:
      - {type: script, pattern: 'jquery[.\-/@]?(\d+\.\d+(?:\.\d+)?)?[^/]*\.js', version: 1, confidence: 0.9}
      - {type: js, key: jQuery, confidence: 1.0}

  Bootstrap:
    category: ui
    signals:
      - {type: stylesheet, pattern: 'bootstrap(?:[.\-@](\d+\.\d+(?:\.\d+)?))?[^/]*\.css', version: 1, confidence: 0.9}
      - {type: script, pattern: 'bootstrap(?:\.bundle)?(?:\.min)?\.js', confidence: 0.8}

  Tailwind CSS:
    category: ui
    signals:
      - {type: script, pattern: 'cdn\.tailwindcss\.com', confidence: 1.0}

  Font Awesome:
    category: font
    signals:
      - {type: stylesheet, pattern: 'font-?awesome', confidence: 1.0}

  Google Fonts:
    category: font
    signals:
      - {type: stylesheet, pattern: 'fonts\.googleapis\.com', confidence: 1.0}
      - {type: html, pattern: 'fonts\.gstatic\.com', confidence: 0.8}

  Swiper:
    category: javascript
    signals:
      - {type: script, pattern: 'swiper(?:-bundle)?(?:\.min)?\.js', confidence: 0.9}
